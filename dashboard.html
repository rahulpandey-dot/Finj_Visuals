<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GM Analysis Jan & Feb'26 - Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            width: 100%;
            max-width: 1200px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
            font-weight: 600;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .dashboard-wrapper {
            padding: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8f9fa;
            min-height: 600px;
        }
        
        .dashboard-wrapper iframe {
            width: 100%;
            max-width: 1140px;
            height: 541.25px;
            border-radius: 8px;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }
        
        .footer {
            background: #f8f9fa;
            padding: 20px;
            text-align: center;
            color: #666;
            font-size: 0.9em;
            border-top: 1px solid #e0e0e0;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 1.5em;
            }
            
            .dashboard-wrapper {
                padding: 15px;
            }
            
            .dashboard-wrapper iframe {
                height: auto;
                min-height: 400px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📊 GM Analysis Dashboard</h1>
            <p>January & February 2026 Analysis</p>
        </div>
        
        <div class="dashboard-wrapper">
            <iframe title="GM Analysis Jan & Feb'26" src="https://app.powerbi.com/reportEmbed?reportId=323954c2-0a7f-498f-9e19-b56f78e9f509&autoAuth=true&ctid=d8c38637-d48d-437c-b2c4-a5dbb81e553c&actionBarEnabled=true&reportCopilotInEmbed=true" frameborder="0" allowFullScreen="true"></iframe>
        </div>
        
        <div class="footer">
            <p>Last Updated: March 2026 | Powered by Power BI</p>
        </div>
    </div>
</body>
</html>
